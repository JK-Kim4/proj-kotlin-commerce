# 네트워크
bind 0.0.0.0
port 6379
protected-mode no

# 영속화: AOF 권장
appendonly yes
appendfsync everysec

# RDB 스냅샷(옵션) - 필요 없으면 주석
# save 900 1
# save 300 10
# save 60 10000

# 데이터 디렉터리
dir /data

# 보안(옵션) - 암호 쓰면 아래 주석 해제
# requirepass YOUR_REDIS_PASSWORD

# 메모리 정책(옵션)
# maxmemory 512mb
# maxmemory-policy allkeys-lru
